# Maintain dependencies independently on main and development.
version: 2

updates:
  # GitHub Actions updates for main.
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - "*"

  # GitHub Actions updates for development.
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - "*"

  # Terraform provider and module updates for main.
  - package-ecosystem: terraform
    directory: /terraform
    target-branch: main
    schedule:
      interval: weekly
    groups:
      terraform-dependencies:
        patterns:
          - "*"

  # Terraform provider and module updates for development.
  - package-ecosystem: terraform
    directory: /terraform
    target-branch: development
    schedule:
      interval: weekly
    groups:
      terraform-dependencies:
        patterns:
          - "*"

  # Pre-commit hook updates for main.
  - package-ecosystem: pre-commit
    directory: /
    target-branch: main
    schedule:
      interval: weekly

  # Pre-commit hook updates for development.
  - package-ecosystem: pre-commit
    directory: /
    target-branch: development
    schedule:
      interval: weekly