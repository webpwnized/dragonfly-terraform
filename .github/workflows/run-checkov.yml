# Scan Dragonfly's Terraform configuration for security misconfigurations.
name: Scan Terraform with Checkov

on:
  # Preserve scanning on every push.
  push: {}

  # Give developers feedback while reviewing proposed changes.
  pull_request: {}

  # Allow maintainers to run a scan from the Actions tab.
  workflow_dispatch: {}

jobs:
  checkov-job:
    name: checkov-action
    runs-on: ubuntu-latest

    permissions:
      # Read repository files and workflow metadata.
      actions: read
      contents: read

      # Publish SARIF findings to GitHub Code Scanning.
      security-events: write

    steps:
      - name: Checkout repository
        # Dependabot can propose updates to this pinned action.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan needs source files without retained Git credentials.
          persist-credentials: false

      - name: Create report directory
        # Ensure the destination exists before Checkov writes its report.
        run: mkdir -p reports

      - name: Scan Terraform with Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          # Scan the directory containing Dragonfly's Terraform resources.
          directory: terraform/
          framework: terraform

          # Show failed checks without listing every passing check.
          quiet: true

          # Keep security findings report-only during rollout.
          # Scanner execution errors can still fail the step.
          soft_fail: true

          # Print readable findings and also write a SARIF report.
          # Output destinations correspond to the formats in the same order.
          output_format: cli,sarif
          output_file_path: console,reports/results.sarif

          # Preserve analysis of referenced public Terraform modules.
          download_external_modules: true
          log_level: WARNING

      - name: Save Checkov report
        # Retain any report produced, including after a failed scan step.
        if: ${{ !cancelled() && hashFiles('reports/results.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkov-terraform-report
          path: reports/results.sarif
          if-no-files-found: error

      - name: Publish Checkov findings to GitHub Code Scanning
        # Upload available findings even if the scan step failed.
        # Keep the category stable so GitHub can track this analysis.
        if: ${{ !cancelled() && hashFiles('reports/results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/results.sarif
          category: Checkov Terraform Scan